[project]
name = "friday"
version = "0.1.0"
description = "Personal home voice assistant (Jarvis/Friday style) with pluggable tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
friday = "friday.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
