[project]
name = "friday"
version = "0.1.0"
description = "Personal voice AI assistant in the spirit of JARVIS and FRIDAY, with pluggable tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved." }
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "vosk>=0.3.42",
    "sherpa-onnx>=1.12",
]
# локальный голос Silero (тянет torch, ~1 ГБ)
silero = [
    "torch>=2.2",
    "num2words>=0.5.13",
]
# альтернативный wake word движок
porcupine = [
    "pvporcupine>=3.0",
]
dev = [
    "numpy>=1.26",
    "pytest>=8",
    "ruff>=0.5",
    "num2words>=0.5.13",
]

[project.scripts]
friday = "friday.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
